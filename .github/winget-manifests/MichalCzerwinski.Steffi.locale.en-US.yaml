ShortDescription: A domain-specific language for vector graphics and animations
Description: |-
  Steffi is a domain-specific language (DSL) for vector graphics and animations.
  Describe shapes, layouts, and styles in .stf files and render them to SVG.
  
  Features:
  - Expressive DSL for describing vector graphics
  - SVG output with standards-compliant rendering
  - Layout engine with VerticalStack, HorizontalStack, and Canvas containers
  - Robust parsing pipeline with lexer and parser layers
  - Rich console UX using Spectre.Console
  - AOT-compiled for fast startup and execution
