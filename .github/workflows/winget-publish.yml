name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-aot:
    name: Build AOT Binaries
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      
      - name: Restore dependencies
        run: dotnet restore src/Steffi.Cli/Steffi.Cli.csproj
      
      - name: Publish AOT
        run: |
          dotnet publish src/Steffi.Cli/Steffi.Cli.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishSingleFile=false `
            -o ./publish/${{ matrix.runtime }}
      
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.event.release.tag_name }}" -replace '^v', ''
          }
          
          Compress-Archive -Path ./publish/${{ matrix.runtime }}/* `
            -DestinationPath "./steffi-$version-${{ matrix.runtime }}.zip"
      
      - name: Calculate SHA256
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.event.release.tag_name }}" -replace '^v', ''
          }
          
          $hash = (Get-FileHash -Algorithm SHA256 "./steffi-$version-${{ matrix.runtime }}.zip").Hash
          echo "SHA256: $hash"
          echo "PACKAGE_HASH=$hash" >> $env:GITHUB_ENV
          $hash | Out-File -FilePath "./steffi-$version-${{ matrix.runtime }}.zip.sha256" -NoNewline
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steffi-${{ matrix.runtime }}
          path: |
            steffi-*.zip
            steffi-*.zip.sha256
          retention-days: 7
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            steffi-*.zip
            steffi-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    name: Publish to WinGet
    needs: build-aot
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Get version and URL
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.event.release.tag_name }}" -replace '^v', ''
          }
          
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/download/v$version" >> $env:GITHUB_ENV
      
      - name: Read SHA256 hashes
        shell: pwsh
        run: |
          $x64Hash = Get-Content ./artifacts/steffi-win-x64/steffi-${{ env.VERSION }}-win-x64.zip.sha256
          $arm64Hash = Get-Content ./artifacts/steffi-win-arm64/steffi-${{ env.VERSION }}-win-arm64.zip.sha256
          
          echo "X64_HASH=$x64Hash" >> $env:GITHUB_ENV
          echo "ARM64_HASH=$arm64Hash" >> $env:GITHUB_ENV
      
      - name: Submit to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: MichalCzerwinski.Steffi
          version: ${{ env.VERSION }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ${{ github.repository_owner }}
